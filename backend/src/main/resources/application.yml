spring:
  config:
    import: classpath:assistant-profile.yml      # perfil del asistente por rol (F4)
  application:
    name: segurplus-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/${POSTGRES_DB:segurplus}}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  mvc:
    problemdetails:
      enabled: true
    log-request-details: false

server:
  port: 8100
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

segurplus:
  clock:
    mode: FIXED                 # FIXED | SYSTEM (ADR 0006)
    fixed-date: ${APP_CLOCK_FIXED_DATE:2027-01-15}
    zone: Europe/Madrid
  auth:
    jwt-secret: ${JWT_SECRET}   # >= 32 bytes; solo en el entorno
    issuer: segurplus
    access-token-ttl: PT10M     # 10-15 min (ADR 0007)
    refresh-token-ttl: P7D
    bcrypt-strength: 10
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER}
    secret-key: ${MINIO_ROOT_PASSWORD}
    bucket: segurplus-documents
  documents:
    max-upload-bytes: 10485760
    preview:
      max-sheets: 5
      max-rows: 200
      max-columns: 30
      max-cell-chars: 500
  seed:
    enabled: false              # solo desarrollo: usuarios y documentos de prueba (ver backend/README.md)
  ai:                           # F4: Dify + Gemini (claves solo en el entorno; nunca versionadas ni registradas)
    dify:
      base-url: ${DIFY_BASE_URL:}
      app-api-key: ${DIFY_APP_API_KEY:}                      # app de generación (modelo principal)
      app-api-key-fallback: ${DIFY_APP_API_KEY_FALLBACK:}    # app de generación con el modelo de reserva
      planner-api-key: ${DIFY_PLANNER_API_KEY:}              # app de planificación (sin conocimiento)
      planner-api-key-fallback: ${DIFY_PLANNER_API_KEY_FALLBACK:}
      knowledge-api-key: ${DIFY_KNOWLEDGE_API_KEY:}
      dataset-prefix: "SegurPlus "
      connect-timeout: 3s                                    # ADR 0003: 3 s / 10 s / 30 s / 120 s
      first-response-timeout: 10s
      inactivity-timeout: 30s
      total-timeout: 120s
    indexer:
      enabled: ${AI_INDEXER_ENABLED:true}
      interval-seconds: 30
      retry-after-seconds: 300
      poll-timeout-seconds: 120
      stuck-after-seconds: 900
    retrieval:
      top-k: 5                    # por KB
      max-context-chunks: 8       # tras re-autorizar
      score-threshold: 0.0
    chat:
      max-message-chars: 2000
      history-turns: 6
