# Infraestructura local de SegurPlus (F1): PostgreSQL 16 + MinIO, y (F3) el contenedor web con Caddy. El backend se ejecuta fuera (java -jar / ./mvnw spring-boot:run).
# Secretos: deploy/.env (no versionado; plantilla en ../.env.example). Datos: deploy/data/ (en .gitignore).
# Puertos en 127.0.0.1 (no expuestos a la red): PostgreSQL 5434, MinIO API 9000, consola 9001. El frontend (web) va en la IP de la LAN, 5174.
name: segurplus

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER en deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD en deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-segurplus}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    # minio/minio ya no se publica en Docker Hub: imagen de Chainguard fijada por digest (misma que usan los tests).
    image: cgr.dev/chainguard/minio@sha256:cee9a8e35885e93f14b3cb32960e5017aff74e2adfb52ba87c65003b0163886b
    command: ["server", "/data", "--console-address", ":9001"]
    # La imagen corre como uid 65532; se usa el usuario local para poder escribir en el bind mount deploy/data.
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER en deploy/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD en deploy/.env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ./data/minio:/data
    restart: unless-stopped

  # F3: frontend por HTTPS solo en la LAN (https://192.168.0.28:5174). Caddy sirve frontend/dist (npm run build) y proxifica /api/*
  # al backend que corre en el host (:8100). Publicado SOLO en WEB_BIND_IP; no abrir este puerto en el router.
  web:
    image: caddy:2-alpine
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      WEB_HOST: ${WEB_BIND_IP:-192.168.0.28}
      XDG_DATA_HOME: /data
      XDG_CONFIG_HOME: /data/config
    ports:
      - "${WEB_BIND_IP:-192.168.0.28}:5174:5174"
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../frontend/dist:/srv:ro
      - ./data/caddy:/data          # CA local (se conserva entre reinicios: el navegador solo acepta el aviso una vez)
    restart: unless-stopped
