# Especificación declarativa de la política de acceso (fuente: docs/security/permissions-matrix.md).
# Es DATO, no código: de aquí se generan (a) la siembra de documents.allowed_roles/owner_id y
# (b) la matriz esperada usuario x documento x acción para los tests de autorización (CA-1).
# Regla: READ/DOWNLOAD si rol in allowed_roles o owner == usuario; CREATE/UPDATE/DELETE/ADMINISTER solo MANAGER.
# Decidido por el propietario: READ y DOWNLOAD van juntos (misma condición). No hay casos «lee pero no descarga».
version: 3
read_equals_download: true
actions: [READ, DOWNLOAD, CREATE, UPDATE, DELETE, ADMINISTER]
# Controles positivos obligatorios (READ y DOWNLOAD)
positive_cases:
  - {user: COM001, docs: [D06, D11, D15, D18, D21, D24]}
  - {user: ACC001, docs: [D07, D08, D09, D10, D11, D12, D13]}
  - {user: EMP001, docs: [D14, D15, D16]}
manager_only_actions: [CREATE, UPDATE, DELETE, ADMINISTER]
users:
  DIR001: {role: MANAGER,       department: DIRECCION}
  ACC001: {role: ACCOUNTANT,    department: CONTABILIDAD}
  COM001: {role: SALES_MANAGER, department: COMERCIAL}
  EMP001: {role: EMPLOYEE,      department: COMERCIAL}
  EMP002: {role: EMPLOYEE,      department: COMERCIAL}
  EMP003: {role: EMPLOYEE,      department: COMERCIAL}
  EMP004: {role: EMPLOYEE,      department: COMERCIAL}
documents:
  - {code: D01, kb: DIRECCION, cls: CONFIDENTIAL, cat: REPORT, owner: null, allowed_roles: [MANAGER]}
  - {code: D02, kb: DIRECCION, cls: RESTRICTED, cat: FINANCE, owner: null, allowed_roles: [MANAGER]}
  - {code: D03, kb: DIRECCION, cls: CONFIDENTIAL, cat: REPORT, owner: null, allowed_roles: [MANAGER]}
  - {code: D04, kb: DIRECCION, cls: RESTRICTED, cat: STRATEGY, owner: null, allowed_roles: [MANAGER]}
  - {code: D05, kb: DIRECCION, cls: RESTRICTED, cat: STRATEGY, owner: null, allowed_roles: [MANAGER]}
  - {code: D06, kb: DIRECCION, cls: CONFIDENTIAL, cat: REPORT, owner: null, allowed_roles: [MANAGER, SALES_MANAGER]}
  - {code: D07, kb: FINANZAS, cls: CONFIDENTIAL, cat: FINANCE, owner: null, allowed_roles: [MANAGER, ACCOUNTANT]}
  - {code: D08, kb: FINANZAS, cls: CONFIDENTIAL, cat: FINANCE, owner: null, allowed_roles: [MANAGER, ACCOUNTANT]}
  - {code: D09, kb: FINANZAS, cls: CONFIDENTIAL, cat: FINANCE, owner: null, allowed_roles: [MANAGER, ACCOUNTANT]}
  - {code: D10, kb: FINANZAS, cls: CONFIDENTIAL, cat: FINANCE, owner: null, allowed_roles: [MANAGER, ACCOUNTANT]}
  - {code: D11, kb: FINANZAS, cls: CONFIDENTIAL, cat: FINANCE, owner: null, allowed_roles: [MANAGER, SALES_MANAGER, ACCOUNTANT]}
  - {code: D12, kb: FINANZAS, cls: CONFIDENTIAL, cat: FINANCE, owner: null, allowed_roles: [MANAGER, ACCOUNTANT]}
  - {code: D13, kb: FINANZAS, cls: CONFIDENTIAL, cat: REPORT, owner: null, allowed_roles: [MANAGER, ACCOUNTANT]}
  - {code: D14, kb: EMPLEADOS, cls: RESTRICTED, cat: CONTRACT, owner: EMP001, allowed_roles: [MANAGER]}
  - {code: D15, kb: EMPLEADOS, cls: CONFIDENTIAL, cat: COMMERCIAL_ACTIVITY, owner: EMP001, allowed_roles: [MANAGER, SALES_MANAGER]}
  - {code: D16, kb: EMPLEADOS, cls: RESTRICTED, cat: PAYROLL, owner: EMP001, allowed_roles: [MANAGER]}
  - {code: D17, kb: EMPLEADOS, cls: RESTRICTED, cat: CONTRACT, owner: EMP002, allowed_roles: [MANAGER]}
  - {code: D18, kb: EMPLEADOS, cls: CONFIDENTIAL, cat: COMMERCIAL_ACTIVITY, owner: EMP002, allowed_roles: [MANAGER, SALES_MANAGER]}
  - {code: D19, kb: EMPLEADOS, cls: RESTRICTED, cat: PAYROLL, owner: EMP002, allowed_roles: [MANAGER]}
  - {code: D20, kb: EMPLEADOS, cls: RESTRICTED, cat: CONTRACT, owner: EMP003, allowed_roles: [MANAGER]}
  - {code: D21, kb: EMPLEADOS, cls: CONFIDENTIAL, cat: COMMERCIAL_ACTIVITY, owner: EMP003, allowed_roles: [MANAGER, SALES_MANAGER]}
  - {code: D22, kb: EMPLEADOS, cls: RESTRICTED, cat: PAYROLL, owner: EMP003, allowed_roles: [MANAGER]}
  - {code: D23, kb: EMPLEADOS, cls: RESTRICTED, cat: CONTRACT, owner: EMP004, allowed_roles: [MANAGER]}
  - {code: D24, kb: EMPLEADOS, cls: CONFIDENTIAL, cat: COMMERCIAL_ACTIVITY, owner: EMP004, allowed_roles: [MANAGER, SALES_MANAGER]}
  - {code: D25, kb: EMPLEADOS, cls: RESTRICTED, cat: PAYROLL, owner: EMP004, allowed_roles: [MANAGER]}
  - {code: D26, kb: GENERAL, cls: INTERNAL, cat: MANUAL, owner: null, allowed_roles: [MANAGER, ACCOUNTANT, SALES_MANAGER, EMPLOYEE]}
  - {code: D27, kb: GENERAL, cls: INTERNAL, cat: MANUAL, owner: null, allowed_roles: [MANAGER, ACCOUNTANT, SALES_MANAGER, EMPLOYEE]}
  - {code: D28, kb: GENERAL, cls: INTERNAL, cat: MANUAL, owner: null, allowed_roles: [MANAGER, ACCOUNTANT, SALES_MANAGER, EMPLOYEE]}
  - {code: D29, kb: GENERAL, cls: INTERNAL, cat: MANUAL, owner: null, allowed_roles: [MANAGER, ACCOUNTANT, SALES_MANAGER, EMPLOYEE]}
  - {code: G01, kb: GENERAL, cls: INTERNAL, cat: POLICY, owner: null, allowed_roles: [MANAGER, ACCOUNTANT, SALES_MANAGER, EMPLOYEE]}
  - {code: G02, kb: GENERAL, cls: INTERNAL, cat: POLICY, owner: null, allowed_roles: [MANAGER, ACCOUNTANT, SALES_MANAGER, EMPLOYEE]}
  - {code: G03, kb: GENERAL, cls: INTERNAL, cat: POLICY, owner: null, allowed_roles: [MANAGER, ACCOUNTANT, SALES_MANAGER, EMPLOYEE]}
# Perfil del asistente único (configuración, no tabla). El backend deriva del rol del JWT:
# KBs de Dify que se consultan y alcance de las herramientas SQL. Las KBs son cota superior: manda la re-autorización.
assistant_profile:
  MANAGER:       {kbs: [GENERAL, DIRECCION, FINANZAS, EMPLEADOS], filter: none,                 tools: {get_sales_summary: GLOBAL,    get_commissions: GLOBAL, get_policies_by_status: GLOBAL,    get_targets: GLOBAL}}
  ACCOUNTANT:    {kbs: [GENERAL, FINANZAS],                       filter: allowed_roles,        tools: {get_sales_summary: AGGREGATE, get_commissions: GLOBAL, get_policies_by_status: AGGREGATE, get_targets: null}}
  SALES_MANAGER: {kbs: [GENERAL, DIRECCION, FINANZAS, EMPLEADOS], filter: allowed_roles,        tools: {get_sales_summary: TEAM,      get_commissions: TEAM,   get_policies_by_status: TEAM,      get_targets: TEAM}}
  EMPLOYEE:      {kbs: [GENERAL, EMPLEADOS],                      filter: allowed_roles_or_owner, tools: {get_sales_summary: OWN,       get_commissions: OWN,    get_policies_by_status: OWN,       get_targets: OWN}}
